# Don't forget to surround abstract with double quotes
abstract: "MedMNIST v2 is a widely used benchmark of standardized, lightweight
           biomedical image classification datasets whose Table 3 ResNet baselines
           anchor a large body of follow-up work. We replicate the 28-pixel ResNet
           baselines with a from-scratch PyTorch reimplementation that shares no code
           with the authors' experiments repository: 9 of 13 configurations land inside
           a pre-registered tolerance of |dAUC| <= 0.02 and |dACC| <= 0.03, and all four
           misses are analysed rather than discarded. Three of the four are
           accuracy-only misses with AUC essentially on the paper, reflecting
           operating-point rather than ranking disagreement; BreastMNIST, the smallest
           dataset, shows the highest seed sensitivity in the matrix. A separate
           reproduction arm running the authors' own script unmodified on DermaMNIST at
           224 pixels also lands inside tolerance. We additionally record a
           specification gap: the 28-pixel backbone is underspecified in the original
           text, and a CIFAR-style stem rather than the stock torchvision stem is what
           makes the numbers line up. We then extend the study with an equity audit of
           DermaMNIST. Per-class recall correlates strongly with training frequency
           (Pearson r = 0.81) while per-class macro-AUC does not (r = -0.28), so the
           benchmark's headline metric is near-blind to the imbalance its own class
           distribution creates: the baseline recalls 8.7% of dermatofibroma test cases
           while that class's AUC reads 0.917. Expected calibration error is nearly four
           times worse on rare classes than on common ones (0.208 vs 0.053), rare-class
           errors collapse directionally into the 67% majority class at up to full
           confidence, and a 4x parameter compression that leaves aggregate metrics
           almost untouched drives the rarest class's F1 to zero. We quantify the
           equity/accuracy tradeoffs of two standard mitigations and argue that
           MedMNIST-style leaderboards should report per-class recall and
           rarity-stratified calibration alongside macro-AUC."

